<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Bexley Pay · Merchant</title>
<style>
:root{--bg:#050505;--card:#0d0f0d;--ink:#f2f2f2;--mute:#8a8f8a;--line:#232823;--g:#2bd96b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:28px 20px}
.top{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:24px}.top .sp{flex:1}
.logo{width:30px;height:30px;border-radius:8px;background:var(--g);color:#031a0d;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
h2{font-size:26px;line-height:1.15;margin:0 0 8px;letter-spacing:-1px}.mute{color:var(--mute);margin:0}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
input{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;font:inherit}
button{width:100%;margin-top:20px;background:var(--g);color:#031a0d;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
button.link{width:auto;margin:0;padding:6px 12px;font-size:14px}
.addr{word-break:break-all;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.qr{background:#fff;border-radius:14px;padding:14px;width:max-content;margin:0 auto 12px}.qr img{display:block;width:220px}
.err{color:#ff6b6b;margin-top:10px}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
