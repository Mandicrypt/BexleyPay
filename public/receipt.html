<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Bexley Pay · Receipt</title>
<style>
:root{--bg:#050505;--card:#0d0f0d;--ink:#f2f2f2;--mute:#8a8f8a;--line:#232823;--g:#2bd96b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:28px 20px}
img{display:block;width:100%;border-radius:16px;border:1px solid var(--line)}
p{color:var(--mute);margin:14px 0 0}
button,a.b{display:block;width:100%;margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
@media print{button,a.b{display:none}}
</style></head><body><div class="wrap">
<img id="img" alt="Payment receipt">
<p id="msg"></p>
<button id="copy">Copy receipt link</button>
<button onclick="print()">Print or save as PDF</button>
</div>
<script>
const id=new URLSearchParams(location.search).get("id")||"";
const img=document.getElementById("img");
img.src="/api/receipt-image?id="+encodeURIComponent(id);
img.onerror=()=>{img.remove();document.getElementById("msg").textContent="Receipt not found. It appears once the payment is confirmed."};
document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent="Copied"}catch(_){}};
</script></body></html>
